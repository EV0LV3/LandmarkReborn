[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landmark-emu"
version = "0.1.0"
description = "Python server emulator for the sunset MMORPG Landmark (port of LandmarkEmu)."
readme = "README.md"
license = { text = "AGPL-3.0" }
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
landmark-auth = "landmark_emu.auth.__main__:main"
landmark-world = "landmark_emu.world.__main__:main"
landmark-parser = "landmark_emu.parser.__main__:main"

[tool.setuptools.packages.find]
include = ["landmark_emu*"]

[tool.setuptools.package-data]
landmark_emu = ["resources/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
